name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # No install scripts: nothing the page needs runs one, and a compromised package cannot run code here.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check
